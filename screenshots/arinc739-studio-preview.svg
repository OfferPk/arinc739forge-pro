  <text x="540" y="170" font-family="monospace" font-size="11" fill="#38bdf8">173 LINE 1 / W2: 'RTE ' -&gt; 0xE18A05DE (ODD PARITY)</text>
  <text x="540" y="200" font-family="monospace" font-size="11" fill="#10b981">173 LINE 1 / W3: '1 LE' -&gt; 0xE19205DE (ODD PARITY)</text>
