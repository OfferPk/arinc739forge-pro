    ARINC 739A MCDU CERTIFIED
  </text>

  <!-- Left: MCDU Hardware Simulator -->
  <rect x="20" y="70" width="460" height="505" rx="12" fill="#1e2530" stroke="#334155" stroke-width="2"/>
