  <text x="80" y="160" font-family="monospace" font-size="10" fill="#00e5ff"> 250KT/10000       DES</text>
  <text x="80" y="180" font-family="monospace" font-size="12" fill="#e040fb">&lt;DESIS           25 NM</text>
  <text x="80" y="200" font-family="monospace" font-size="10" fill="#00e5ff"> 240KT/FL150       CRZ</text>
  <text x="80" y="220" font-family="monospace" font-size="12" fill="#ffffff">&lt;TOSNA           48 NM</text>
  <text x="80" y="240" font-family="monospace" font-size="10" fill="#00e5ff"> .82M /FL350       CRZ</text>
  <text x="80" y="260" font-family="monospace" font-size="12" fill="#ffffff">&lt;KABAN          120 NM</text>
  <text x="80" y="315" font-family="monospace" font-size="12" fill="#00e5ff">&lt;RTE 2 LEGS    LEG DATA&gt;</text>
  <text x="80" y="335" font-family="monospace" font-size="12" fill="#ffffff">OMDB/RW12L</text>

  <!-- LSKs -->
