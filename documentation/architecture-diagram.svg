<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>

  <!-- Title -->
  <text x="480" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">
    ARINC739Forge Pro (v1.0.0) Architecture &amp; Protocol Pipeline
  </text>
  <text x="480" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">
    Multi-Purpose Control &amp; Display Unit (MCDU) | ARINC Characteristic 739A &amp; ARINC 429 Dual Bus
  </text>

  <!-- Block 1: Cockpit MCDU Hardware Terminal -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="250" height="370" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1.5"/>
    <rect width="250" height="40" rx="8" fill="#1e293b"/>
    <text x="125" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">COCKPIT MCDU TERMINAL</text>
    <text x="20" y="75" font-family="monospace" font-size="12" fill="#cbd5e1">• 14-Line x 24-Char Display</text>
    <text x="20" y="105" font-family="monospace" font-size="12" fill="#cbd5e1">• 12x Line Select Keys (LSK)</text>
    <text x="35" y="125" font-family="monospace" font-size="11" fill="#94a3b8">- 1L..6L (Left Hand Side)</text>
    <text x="35" y="145" font-family="monospace" font-size="11" fill="#94a3b8">- 1R..6R (Right Hand Side)</text>
    <text x="20" y="175" font-family="monospace" font-size="12" fill="#cbd5e1">• Alphanumeric Tactile Keypad</text>
    <text x="20" y="205" font-family="monospace" font-size="12" fill="#cbd5e1">• Function Keys (INIT, RTE, LEGS)</text>
    <text x="20" y="235" font-family="monospace" font-size="12" fill="#cbd5e1">• Line 14 Dedicated Scratchpad</text>
    <text x="20" y="265" font-family="monospace" font-size="12" fill="#cbd5e1">• Phosphor Color Attributes</text>
    <text x="35" y="285" font-family="monospace" font-size="11" fill="#94a3b8">- Cyan, Green, White, Amber</text>
    <text x="20" y="315" font-family="monospace" font-size="12" fill="#cbd5e1">• Small / Large Font Matrix</text>
    <rect x="20" y="325" width="210" height="30" rx="4" fill="#042f2e" stroke="#14b8a6"/>
    <text x="125" y="345" text-anchor="middle" font-family="monospace" font-size="11" fill="#2dd4bf">FAA TSO-C113 / DO-178C</text>
  </g>

  <!-- Block 2: ARINC 739 Protocol Engine -->
  <g transform="translate(350, 110)" filter="url(#shadow)">
    <rect width="260" height="370" rx="8" fill="#111827" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="260" height="40" rx="8" fill="url(#cyanGrad)"/>
    <text x="130" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#041421">ARINC 739 PROTOCOL CORE</text>
    <text x="20" y="75" font-family="monospace" font-size="12" fill="#e2e8f0">• Line Serialization (6 w/line)</text>
    <text x="35" y="95" font-family="monospace" font-size="11" fill="#94a3b8">- 4 Characters per 32b Word</text>
    <text x="20" y="125" font-family="monospace" font-size="12" fill="#e2e8f0">• Label 173 Display Data RX</text>
    <text x="20" y="155" font-family="monospace" font-size="12" fill="#e2e8f0">• Label 172 Keypress TX</text>
    <text x="20" y="185" font-family="monospace" font-size="12" fill="#e2e8f0">• Bit 32 Odd Parity Generator</text>
    <text x="20" y="215" font-family="monospace" font-size="12" fill="#e2e8f0">• Hardware Label Bit-Reversal</text>
    <text x="20" y="245" font-family="monospace" font-size="12" fill="#e2e8f0">• Subsystem Port Multiplexing</text>
    <text x="20" y="275" font-family="monospace" font-size="12" fill="#e2e8f0">• Handshake Page Allocation</text>
    <text x="20" y="305" font-family="monospace" font-size="12" fill="#e2e8f0">• SSM Normal Mode Encoding</text>
    <rect x="20" y="325" width="220" height="30" rx="4" fill="#172554" stroke="#3b82f6"/>
    <text x="130" y="345" text-anchor="middle" font-family="monospace" font-size="11" fill="#60a5fa">ARINC 739A-1 COMPLIANT</text>
  </g>

  <!-- Block 3: Avionics Subsystems -->
  <g transform="translate(670, 110)" filter="url(#shadow)">
    <rect width="250" height="370" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1.5"/>
    <rect width="250" height="40" rx="8" fill="#1e293b"/>
    <text x="125" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a855f7">AVIONICS SUBSYSTEMS</text>
    <text x="20" y="75" font-family="monospace" font-size="12" fill="#cbd5e1">• Flight Management (FMS 1/2)</text>
    <text x="35" y="95" font-family="monospace" font-size="11" fill="#94a3b8">- ARINC 702A Route Guidance</text>
    <text x="20" y="125" font-family="monospace" font-size="12" fill="#cbd5e1">• ACARS / ATSU Communications</text>
    <text x="35" y="145" font-family="monospace" font-size="11" fill="#94a3b8">- ARINC 618 AOC Telex Datalink</text>
    <text x="20" y="175" font-family="monospace" font-size="12" fill="#cbd5e1">• Satellite Comms (SATCOM SDU)</text>
    <text x="20" y="205" font-family="monospace" font-size="12" fill="#cbd5e1">• Maintenance Computer (CMC)</text>
    <text x="35" y="225" font-family="monospace" font-size="11" fill="#94a3b8">- BITE Fault Diagnoses</text>
    <text x="20" y="255" font-family="monospace" font-size="12" fill="#cbd5e1">• Terrain Awareness (TAWS)</text>
    <text x="20" y="285" font-family="monospace" font-size="12" fill="#cbd5e1">• ADS-C / CPDLC Interface</text>
    <rect x="20" y="325" width="210" height="30" rx="4" fill="#3b0764" stroke="#a855f7"/>
    <text x="125" y="345" text-anchor="middle" font-family="monospace" font-size="11" fill="#d8b4fe">ARINC 429 HIGH-SPEED BUS</text>
  </g>

  <!-- Connectors -->
  <line x1="290" y1="295" x2="350" y2="295" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4"/>
  <line x1="610" y1="295" x2="670" y2="295" stroke="#06b6d4" stroke-width="2"/>
</svg>